# SANGYAN SHIELD Machine Learning Configuration
# Strict ML Pipeline Configuration for Scam & Digital Fraud Detection

pipeline_version: "1.0.0"

dataset:
  raw_dir: "ml/datasets/raw"
  processed_dir: "ml/datasets/processed"
  train_path: "ml/datasets/train/train.jsonl"
  val_path: "ml/datasets/validation/val.jsonl"
  test_path: "ml/datasets/test/test.jsonl"
  quality_report_path: "ml/datasets/dataset_quality_report.json"

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  random_seed: 42

models:
  baseline:
    name: "tfidf-logistic-regression"
    c_reg: 1.0
    max_iter: 1000
    metrics_path: "ml/artifacts/baseline_metrics.json"

  task_a_classifier:
    name: "sangyan-calibrated-nlp-classifier"
    version: "1.0.0"
    classes: ["BENIGN", "SUSPICIOUS", "SCAM_LIKE"]
    feature_config:
      word_ngram_range: [1, 3]
      char_ngram_range: [3, 5]
      min_df: 1
      max_features: 5000
    calibration_method: "sigmoid" # Platt scaling
    cv_folds: 3

  task_b_multilabel:
    name: "sangyan-scam-signals-multilabel"
    version: "1.0.0"
    signals:
      - "GUARANTEED_RETURN"
      - "URGENCY"
      - "OTP_REQUEST"
      - "PAYMENT_REQUEST"
      - "IMPERSONATION"
      - "FAKE_REGISTRATION"
      - "FAKE_APP"
      - "SUSPICIOUS_URL"
      - "REFERRAL_PRESSURE"
      - "WITHDRAWAL_FEE"
      - "SOCIAL_PROOF"
      - "EMOTIONAL_PRESSURE"
      - "INVESTMENT_SOLICITATION"
      - "PASSWORD_REQUEST"
      - "PIN_REQUEST"
      - "UNKNOWN_APP"
    safety_critical_signals:
      - "OTP_REQUEST"
      - "PAYMENT_REQUEST"
      - "PASSWORD_REQUEST"
      - "PIN_REQUEST"
      - "FAKE_APP"
      - "SUSPICIOUS_URL"
    default_threshold: 0.50
    safety_critical_threshold: 0.35

evaluation:
  reports_dir: "reports"
  metrics_path: "ml/artifacts/evaluation_metrics.json"
  safety_report_path: "ml/artifacts/safety_signal_report.json"
  false_negative_analysis_path: "reports/false_negative_analysis.md"

artifacts_dir: "ml/artifacts"
